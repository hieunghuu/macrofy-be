services:
  postgres:
    image: postgres:16-alpine
    container_name: food_coach_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-food_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food_coach}
      POSTGRES_DB: ${POSTGRES_DB:-food_coach}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food_coach} -d ${POSTGRES_DB:-food_coach}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    env_file:
       - .env
    volumes:
       - ./data-pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  postgres:
    driver: bridge